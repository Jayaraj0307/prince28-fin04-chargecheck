
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5433/app
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5433/app

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Load sample data
        run: uv run python scripts/load_db.py

      - name: Tests
        run: uv run pytest -v

  image:
    name: build image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main

  deploy:
    name: deploy to production
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run production migrations
        run: uv run alembic upgrade head

      - name: Deploy exact image to Render
        run: |
          curl --fail --show-error --silent \
            --get \
            --data-urlencode "imgURL=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" \
            "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

      - name: Smoke test production
        run: |
          for i in {1..30}; do
            response=$(curl -fsS "$HEALTH_URL" || true)
            if echo "$response" | grep -q "$GITHUB_SHA"; then
              echo "Production deployment verified: $GITHUB_SHA"
              exit 0
            fi
            echo "Waiting for deployment..."
            sleep 10
          done
          echo "Deployment health check failed"
          exit 1
        env:
          HEALTH_URL: https://prince28-fin04-chargecheck-main.onrender.com/health
